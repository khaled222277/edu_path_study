name: CI

# Every push to any branch, every pull request, and a manual button.
# (A branch with an open PR runs twice, once per trigger; `concurrency` cancels the older run.)
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # CPU-only torch keeps the install small; requirements.txt then sees it as
      # already satisfied.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      # No Postgres, Ollama, Chroma data or secrets needed: the suite fakes all of them
      # and pins its own environment in tests/conftest.py. The HF_*_OFFLINE flags make a
      # test that tries to download a model fail loudly instead of quietly fetching 2 GB.
      - name: Run tests
        run: pytest
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Component tests (jsdom)
        run: npm run test:ui
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
